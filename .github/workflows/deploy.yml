name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # SiteReal writes root-absolute paths (/scripts/..., /favicon.svg) that ignore `base`.
      # Prefix them in the built HTML so they resolve under /teste_sitereal_01/.
      - name: Prefix root-absolute paths with the base
        run: |
          find dist -name '*.html' -print0 | xargs -0 perl -pi -e 's{((?:src|href)=")/(?!teste_sitereal_01/|/)}{$1/teste_sitereal_01/}g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
